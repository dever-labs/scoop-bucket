# Describes this repository in devhub (https://hub.dever.dk), dever-labs'
# developer portal. devhub's GitHub discovery reads this file from the
# default branch.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: scoop-bucket
  namespace: devtools
  title: Scoop bucket
  description: >
    The dever-labs Scoop bucket (bucket/) — Windows manifests for dever-labs
    apps, updated by each app's release workflow.
  annotations:
    github.com/project-slug: dever-labs/scoop-bucket
    # No docs site on purpose: the README is all there is (devhub "Has docs").
    devhub/docs: none
  tags: [scoop, windows]
  links:
    - url: https://scoop.sh
      title: Scoop
spec:
  type: distribution
  lifecycle: production
  owner: group:devtools/engineering
  system: system:devtools/distribution
